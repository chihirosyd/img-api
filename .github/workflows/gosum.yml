# 自动升级依赖并提交 go.mod / go.sum
#
# 说明：本地开发环境未安装 Go，无法手工维护 go.mod / go.sum。
# 本工作流在每次推送（go.mod 变更）或手动触发时：
#   1. go get -u ./... 将全部依赖升级到最新版本
#   2. go mod tidy 重新整理依赖并生成 go.sum
#   3. 自动提交 go.mod / go.sum
# 保证依赖与 Go 工具链保持同步，并可复现构建。
name: Update go.sum

on:
  push:
    branches: [main, master]
    paths:
      - 'go.mod'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gosum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Upgrade deps & tidy (generates go.sum)
        run: |
          go get -u ./...
          go mod tidy

      - name: Commit go.mod / go.sum
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update go.mod / go.sum"
          file_pattern: "go.mod go.sum"
