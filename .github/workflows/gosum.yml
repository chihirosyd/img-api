# 自动升级依赖并提交 go.mod / go.sum
#
# 说明：本地已有 Go 环境（go get -u ./... && go mod tidy 可直接维护依赖），
# 本工作流作为兜底：push 的 go.mod 变更若未附带最新 go.sum，
# 自动执行升级 + 整理并提交，使 CI 与本地构建保持一致：
#   1. go get -u ./... 将全部依赖升级到最新版本
#   2. go mod tidy 重新整理依赖并生成 go.sum
#   3. 自动提交 go.mod / go.sum
name: Update go.sum

on:
  push:
    branches: [main, master]
    paths:
      - 'go.mod'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gosum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Upgrade deps & tidy (generates go.sum)
        run: |
          go get -u ./...
          go mod tidy

      - name: Commit go.mod / go.sum
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update go.mod / go.sum"
          file_pattern: "go.mod go.sum"
