# 自动生成并提交 go.sum（仓库当前未提交 go.sum，首次推送后由本工作流补齐）
#
# 说明：本地开发环境未安装 Go，无法手工生成 go.sum。
# 本工作流在每次推送（go.mod 变更）时执行 go mod tidy 并提交 go.mod/go.sum，
# 保证依赖校验和可复现构建。提交后的下一次 push 会再次触发 CI 全绿。
name: Update go.sum

on:
  push:
    branches: [main, master]
    paths:
      - 'go.mod'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gosum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Tidy modules (generates go.sum)
        run: go mod tidy

      - name: Commit go.mod / go.sum
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update go.mod / go.sum"
          file_pattern: "go.mod go.sum"
