# 推送 tag（v*）时自动构建多架构 Docker 镜像并推送到 GitHub Container Registry (GHCR)
#
# 镜像地址：ghcr.io/chihirosyd/img-api:latest
# 触发方式：git tag v1.0.0 && git push origin v1.0.0
#
# ⚠️ 首次推送后：到仓库的 Packages 页面将镜像可见性改为 Public，
#    否则其他用户无法匿名拉取。
name: Build Docker Image

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/chihirosyd/img-api
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # 仅在推送 tag 时推送到 GHCR；PR 仅验证能否构建
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
