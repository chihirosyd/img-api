# 镜像构建验证与手动推送
#
# ⚠️ tag 推送的镜像发布已移至 release.yml 的 docker job（needs: check）：
# go vet / staticcheck / test / race / govulncheck 全绿后才构建推送，
# 避免测试失败时镜像仍被发布、latest 被挪动。
# 本工作流仅保留两种场景：
#   - PR：验证 Dockerfile 能正常构建（不推送）
#   - workflow_dispatch：手动触发构建并推送（人工确认，不走 tag 门禁）
name: Build Docker Image (PR verify / manual)

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/chihirosyd/img-api
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # PR 仅验证能否构建；workflow_dispatch 手动推送（人工确认）
          push: ${{ github.event_name == 'workflow_dispatch' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
