name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

# 创建 Release 需要写权限：GitHub 新仓库默认工作流权限为只读，
# 缺少本声明会导致 action-gh-release 上传时 403
permissions:
  contents: write

jobs:
  # ── 静态检查 & 编译验证 ──
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Ensure module files are tidy
        # 与 gosum.yml 保持一致的升级策略：无本地 Go 环境下，由 CI 统一升级依赖并验证
        run: |
          go get -u ./...
          go mod tidy

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        # 与本地开发一致的深度静态检查（go run 方式，无需预装）
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Run tests
        run: go test ./...

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Run govulncheck
        # Go 1.26 已满足最新版 govulncheck 的工具链要求；
        # 漏洞数据库在扫描时实时拉取，以保持检测结果时效性。
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ── 构建 & 发布 ──
  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Ensure module files are tidy
        run: go mod tidy

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o "dist/img-api${{ matrix.ext }}" ./cmd/server/
          go build -ldflags="-s -w" -o "dist/health-check${{ matrix.ext }}" ./cmd/health-check/
          go build -ldflags="-s -w" -o "dist/build-index${{ matrix.ext }}" ./cmd/build-index/
          go build -ldflags="-s -w" -o "dist/sync-redis${{ matrix.ext }}" ./cmd/sync-redis/

      - name: Package zip
        run: |
          mkdir -p pkg/img-api
          cp dist/* pkg/img-api/
          cp .env.example pkg/img-api/
          mkdir -p pkg/img-api/config && cp config/image.yaml pkg/img-api/config/
          cp -r resources pkg/img-api/
          cp -r docs pkg/img-api/
          cp README.md pkg/img-api/
          cp CHANGELOG.md pkg/img-api/
          # LICENSE 由仓库在 GitHub 上创建（可选），存在时才打包
          [ -f LICENSE ] && cp LICENSE pkg/img-api/
          cd pkg
          zip -r "../img-api-${{ matrix.goos }}-${{ matrix.goarch }}.zip" img-api

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: img-api-${{ matrix.goos }}-${{ matrix.goarch }}
          path: img-api-${{ matrix.goos }}-${{ matrix.goarch }}.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: img-api-${{ matrix.goos }}-${{ matrix.goarch }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
