services:
  img-api:
    # 默认使用 GitHub 自动构建的镜像（推送 tag 后自动生成），用户无需本地编译
    image: ghcr.io/chihirosyd/img-api:latest
    # 如需从源码自行构建：注释掉上面的 image 行，取消下面的 build 段注释
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # 注意：不设置固定 container_name，避免同机部署多实例时命名冲突
    restart: unless-stopped
    # 容器 stdout 日志轮转（不锁 driver，跟随 daemon 全局设置；
    # 已在 daemon.json 配置全局轮转的可删除本段）
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/app/health-check", "-url", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - APP_ROOT=/app
    volumes:
      # 配置目录（.env 与 image.yaml 均在此，编辑后 restart 生效）
      - ./config:/app/config
      # 持久化日志
      - ./storage/logs:/app/storage/logs
      # 本地图片索引（local.json，首启自动生成；不挂载则容器重建后重新生成）
      - ./storage/index:/app/storage/index
      # 挂载图库（方便在不重建镜像的情况下修改；不加 :ro 是为了让 entrypoint
      # 首次启动时能在宿主机侧补齐目录骨架与示例 default.txt）
      - ./resources/txt/pc:/app/resources/txt/pc
      - ./resources/txt/pe:/app/resources/txt/pe
      - ./resources/local:/app/resources/local

  # ── Redis（可选）──
  # 如需启用：取消下面注释，并在 .env 中设置 REDIS_ADDR=redis:6379
  # redis:
  #   image: redis:7-alpine
  #   container_name: img-api-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

volumes:
  redis_data:
